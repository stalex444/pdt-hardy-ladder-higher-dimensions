status:
  scope: The fixed-spectrum four-level formula for arbitrary spectral binary effects, coordinating
    the five exact Hardy zeros, physical attainment and the matching criterion for equality. Finite
    Schmidt-coordinate ensembles through rank four, arbitrary-dimensional rank-one and complementary
    endpoints, and a full-rank twelve-level pure-state witness with exact Born probabilities.
