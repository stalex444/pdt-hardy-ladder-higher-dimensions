version: v0.4
project:
  name: The Two-Step Hardy Ladder in Higher Dimensions
  description: For the ideal two-step Boschi–Hardy ladder with three binary settings per observer
    and five exact zeros, the fixed-state maximum for four positive Schmidt coefficients is the best
    of three disjoint pairings. The proof covers arbitrary complex binary effects and gives attaining
    projective measurements. Equality at the two-qubit plastic-constant value holds exactly when both
    pairs have smaller-to-larger ratio ρ⁻². A finite mixture of pure components through Schmidt rank
    four obeys the same ceiling. Every full-rank pure qutrit is strictly below it. A pure state with
    twelve distinct positive Schmidt weights attains the value through six orthogonal qubit sectors.
  authors:
  - Stephanie Alexander
  responsible_maintainers:
  - Stephanie Alexander
  license: MIT
