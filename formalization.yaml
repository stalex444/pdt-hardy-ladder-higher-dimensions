fidelity:
  divergences: Each pure component is represented on its positive Schmidt support. For unnormalized
    coefficients the score scales with their squared norm. The ensemble theorem accepts a given finite
    decomposition in component coordinates. All forbidden probabilities vanish exactly. Unrestricted
    higher-rank optimality, bounds for noisy measurements and physical clock identifications remain
    open here.
